<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>סוכן כתיבה עסקית AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 600px; position: relative; }
        h1 { color: #2c3e50; text-align: center; }
        textarea { width: 100%; height: 120px; border: 1px solid #ddd; border-radius: 8px; padding: 12px; box-sizing: border-box; font-size: 16px; resize: vertical; }
        button.primary-btn { width: 100%; background-color: #3498db; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 15px; transition: background 0.3s; }
        button.primary-btn:hover { background-color: #2980b9; }

        #result-container { margin-top: 25px; padding: 20px; border-radius: 8px; background-color: #e8f4fd; display: none; border-right: 5px solid #3498db; position: relative; }
        #result-text { white-space: pre-wrap; margin-bottom: 10px; line-height: 1.5; }

        .copy-btn { background-color: #2ecc71; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
        .copy-btn:hover { background-color: #27ae60; }

        .loading { text-align: center; display: none; color: #7f8c8d; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>סוכן כתיבה עסקית</h1>
    <p>הכניסי טקסט גולמי והפכי אותו למייל רשמי:</p>
    <textarea id="userInput" placeholder="למשל: תגיד לו שהמשלוח איחר וזה ממש מעצבן..."></textarea>
    <button class="primary-btn" onclick="processText()">שפר טקסט עכשיו</button>

    <div id="loader" class="loading">הסוכן מעבד את הבקשה...</div>

    <div id="result-container">
        <div id="result-text"></div>
        <button class="copy-btn" onclick="copyToClipboard()">העתק תוצאה</button>
        <span id="copy-status" style="margin-right: 10px; color: #27ae60; font-size: 13px;"></span>
    </div>
</div>

<script>
    async function processText() {
        const text = document.getElementById('userInput').value;
        const resultContainer = document.getElementById('result-container');
        const resultText = document.getElementById('result-text');
        const loader = document.getElementById('loader');

        if (!text) return alert("אנא הכניסי טקסט");

        resultContainer.style.display = 'none';
        loader.style.display = 'block';

        try {
            const response = await fetch('http://127.0.0.1:8000/v1/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });

            const data = await response.json();

            if (data.status === "success") {
                resultText.innerText = data.answer;
                resultContainer.style.display = 'block';
            } else {
                alert("שגיאה מהשרת: " + (data.detail || "משהו השתבש"));
            }
        } catch (error) {
            alert("לא ניתן להתחבר לשרת. ודאי ששרת ה-FastAPI רץ בטרמינל.");
        } finally {
            loader.style.display = 'none';
        }
    }

    function copyToClipboard() {
        const text = document.getElementById('result-text').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const status = document.getElementById('copy-status');
            status.innerText = "הועתק!";
            setTimeout(() => { status.innerText = ""; }, 2000);
        });
    }
</script>

</body>
</html>
